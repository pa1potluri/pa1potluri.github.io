.full{margin-left:auto}.details{display:grid;grid-template-columns:1fr 1.1fr;border:1px solid #ffffff14;border-top:0;border-radius:0 0 8px 8px}.story,.steps{min-width:0}.story{padding:30px 32px;min-height:186px}.step-kicker{font-size:10px;letter-spacing:2px;color:var(--gold);margin:0 0 11px}.story h2{font-size:25px;font-weight:400;margin:0 0 10px;letter-spacing:-.5px}.story p:last-child{font-size:13px;line-height:1.7;color:var(--muted);max-width:520px;margin:0}.steps{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));align-items:center;padding:25px 25px 25px 0;gap:8px}.step{height:96px;text-align:left;padding:16px 12px;border:1px solid #ffffff13;border-radius:5px;background:transparent;transition:background .3s,border-color .3s}.step small{display:block;color:#8b7869;font-size:10px;letter-spacing:1px;margin-bottom:15px}.step strong{font-size:12px;font-weight:400;white-space:normal;display:block;line-height:1.4}.step[aria-pressed=true]{border-color:#e5b36b;background:#e5b36b0b}.step[aria-pressed=true] small{color:var(--gold)}.step:hover{background:#fff5}footer{display:flex;justify-content:space-between;font-size:10px;color:#8c7a6d;padding:24px 0 30px;letter-spacing:.4px}.paused .flow{animation-play-state:paused}.still .flow{animation:none}.theater:fullscreen{width:100%;height:100%;display:flex;flex-direction:column;justify-content:center;background:#080606;border:0;border-radius:0}.theater:fullscreen .stage{width:min(100%,calc((100vh - 68px)*16/9));margin:auto;flex-shrink:0}.theater:fullscreen .transport{width:100%;flex-shrink:0}.theater:fullscreen .stage-note{bottom:15px}@keyframes stream{to{stroke-dashoffset:-16}}@media(prefers-reduced-motion:reduce){*{transition:none!important}.flow{animation:none!important}.world{transform:none!important;animation:none!important}}@media(max-width:760px){header{height:68px}.edition{font-size:8px;letter-spacing:1px}.intro{padding:26px 0 19px}.intro p:last-child{display:none}h1{letter-spacing:-.9px}.details{grid-template-columns:1fr}.story,.steps{min-width:0}.story{padding:24px;min-height:166px}.steps{padding:0 24px 24px}.step{padding:12px 8px;height:100px}.step strong{font-size:11px}.transport{padding:11px;gap:7px}.control{padding:8px 10px}.progress{margin:0 3px}.marker{width:20px;height:20px;left:3px;top:3px;font-size:8px}.stage-note{left:12px;bottom:9px;font-size:7px;letter-spacing:1px}.counter{display:none}footer{font-size:9px;gap:20px}}@media(max-width:380px){.steps{padding:0 12px 18px;gap:4px}.step strong{font-size:10px}.brand{font-size:14px}.full{font-size:10px}.control{padding:8px}.control.primary{min-width:79px}}

<script id="course-data" type="application/json">[{"id":"intro-to-compositing","title":"Intro to Compositing","subtitle":"Separate the elements. Build a believable frame.","alt":"Compositing workstation with perspective layers for a temple plate, green-screen silhouette, smoke, sparks, final composite and a node graph.","stages":[["PLATE","Background plate","Establish the world.","Start with the temple plate. Read perspective, light direction and composition before bringing in any additional elements.","17,24 37.6,17 37,44 16.8,52",[19,28]],["KEY","Green-screen subject","Bring the subject into the scene.","Isolate the silhouetted subject from the green screen. Refine the key and align the subject with the plate’s scale and perspective.","29,28.3 43.8,21 43,47 28.2,55.7",[31,31]],["ATMOSPHERE","Smoke layer","Build depth with atmosphere.","Use the smoke element to connect foreground and background. Balance transparency, contrast and placement so the atmosphere supports the shot.","38,29.6 50.7,22.8 50.3,51 37.3,58",[40,33]],["DETAIL","Sparks & particles","Add energy with restraint.","Place sparks and particles in depth. Match their brightness and softness to the scene so the detail feels integrated.","45.4,31.1 57.3,24.8 56.8,55.5 44.8,61.3",[47,34]],["COMPOSITE","Final composite","Make the layers feel like one shot.","Review the assembled frame. Match colour, shadows and edge treatment, then judge the image as a whole.","53.3,31.2 73.2,20.2 73.1,54.3 52.8,65.7",[56,35]],["CONNECT","Node graph","Keep the process readable.","Trace the visible node graph from separate inputs to the output. A clear graph makes adjustments and shot review easier.","75.7,13 97,10 97,55 75.7,55",[78,16]]],"src":"assets/intro-to-compositing.jpg"},{"id":"advanced-compositing","title":"Advanced Compositing","subtitle":"From separate passes to a convincing final shot.","alt":"A grading monitor shows a detailed CG spaceship against a sunset landscape, connected thumbnails along the bottom and colour scopes on the right.","stages":[["PLATE","Sunset plate","Let the plate guide the shot.","Study the sunset, terrain and atmospheric depth. Use the existing light and perspective as the reference for the CG integration.","12,37 22,42 33,51 55,51 72,48 75,59 10,59",[14,48]],["MATTE","Isolation matte","Control the integration.","Inspect the white ship matte in the lower node strip. Isolation lets you adjust the ship independently while keeping the surrounding plate intact.","19.8,67.5 26.6,68 26.4,74.2 19.2,73.7",[21,69]],["CG","CG spaceship","Match the CG to the scene.","Inspect the spaceship’s silhouette, surfaces and depth. Use the sunset direction to guide the lighting and colour of the render.","23,21 38,18 55,26 67,34 65,39 50,44 31,38 22,29",[34,24]],["LIGHT","Light & atmosphere","Connect the object to its environment.","Study the warm rim light and the sun behind the ship. Light wrap, atmosphere and balanced contrast help place the CG in the photographed world.","55,41 66,39 73,45 72,56 58,58 53,51",[61,47]],["REVIEW","Colour scopes","Check the image beyond the eye.","Read the colour scopes on the right alongside the image. Compare channel balance and tonal range while judging the final composite.","78.5,2 99.5,0 99.5,69 78.5,68",[82,24]]],"src":"assets/advanced-compositing.jpg"},{"id":"ai-creative-pipelines","title":"AI Creative Pipelines","subtitle":"One idea. Connected possibilities.","alt":"Golden light connects camera footage at left to a painted temple frame, a music waveform above right and a vertical phone output.","stages":[["INPUT","Camera footage","Every pipeline starts with a frame.","Begin with camera footage. Establish composition, light and the visual idea that will carry through the entire creative process.","4.7,32.8 21.5,35.7 21.5,57.4 4.7,58.4",[7,36]],["TRANSFORM","Painted image","Give the frame a new visual language.","Explore an AI-assisted painted treatment. Shape the style, refine the image and preserve a consistent creative direction.","36,30.5 58,27 58,63 36,62",[40,34]],["COMPOSE","Music & rhythm","Find the rhythm of the story.","Connect the image to music and sound. Use timing, atmosphere and rhythm to guide how the sequence feels.","63.1,15 77.8,12.5 77.8,27 63.1,28.4",[66,19]],["DELIVER","Phone output","Bring the connected idea to the screen.","Unite picture, motion and sound in a vertical video concept. Review the final composition for the phone viewing experience.","84,22 97.3,18.2 97.3,65.5 84,64.8",[87,27]]],"src":"assets/ai-creative-pipelines.jpg"},{"id":"project-breakdown","title":"Project Breakdown & Portfolio Review","subtitle":"Unpack the shot. Show the decisions behind the result.","alt":"A studio breakdown wall displays a temple plate, green-screen temple, white mattes, smoke, a CG spaceship and final composite, above detail crops and a sketchbook with red pen.","stages":[["PLATE","Original plate","Show where the shot began.","Introduce the temple plate at the left of the wall. Explain the starting composition and the lighting that shaped the final shot.","7.1,31.5 16.8,29 16.1,53.6 6,54",[9,35]],["PREP","Keying setup","Explain the preparation.","Inspect the green-screen temple panel. Describe the isolation work and the preparation needed before combining the elements.","17.5,29 27,26.6 26.3,53.5 16.5,53.5",[19,33]],["MATTE","Roto & mattes","Make the invisible work visible.","Use the white-on-black matte panel to explain selection boundaries, holdouts and separation of the ship and environment.","27.8,26.7 38,24.2 37.3,52.7 26.8,53",[29,31]],["FX","Atmosphere pass","Reveal the atmosphere pass.","Review the smoke panel independently. Explain how density, placement and depth support the final image.","38.7,24.2 49,21.5 48.2,52.5 37.7,52.5",[41,30]],["CG","CG pass","Show the render before integration.","Inspect the neutral spaceship render. Separate modelling and lighting contributions from the final colour and compositing decisions.","49.8,21.4 63,17.8 62.5,51.3 48.6,52.3",[53,27]],["FINAL","Final shot","Bring the breakdown back together.","Compare the final composite at the right with the separate passes. Highlight how colour, lighting and atmosphere connect the elements.","64,17.3 97.8,7.8 98.4,48.8 63,51",[73,28]],["REVIEW","Portfolio review","Turn the breakdown into a clear story.","Use the sketchbook and red pen as the review stage. Organise the shot progression, identify improvements and present your contribution clearly.","51,78.8 87,81.2 85,98 34,93.5",[65,87]]],"src":"assets/project-breakdown.jpg"}]</script><script>(()=>{'use strict';
const courses=JSON.parse(document.getElementById('course-data').textContent),$=id=>document.getElementById(id),reduced=matchMedia('(prefers-reduced-motion: reduce)'),ns='http://www.w3.org/2000/svg';
let course=0,current=0,elapsed=0,last=0,playing=!reduced.matches;const duration=6500;
function svg(tag,attrs){const n=document.createElementNS(ns,tag);for(const [k,v]of Object.entries(attrs))n.setAttribute(k,v);return n}
function stageSelect(index){current=(index+courses[course].stages.length)%courses[course].stages.length;elapsed=0;playing=false;paint();playback()}
function courseSelect(index,manual=true){course=(index+courses.length)%courses.length;current=0;elapsed=0;last=0;if(manual)playing=false;load();paint();playback()}
courses.forEach((c,i)=>{const b=document.createElement('button');b.className='course-button';b.innerHTML='<small>COURSE '+String(i+1).padStart(2,'0')+'</small>';b.append(document.createTextNode(c.title));b.addEventListener('click',()=>courseSelect(i));$('courses').append(b)});
$('courses').hidden=courses.length===1;$('courseArrows').hidden=courses.length===1;
function load(){const c=courses[course];$('art').src=c.src;$('art').alt=c.alt;$('courseTitle').textContent=c.title;$('subtitle').textContent=c.subtitle;$('eyebrow').textContent='INTERACTIVE COURSE PREVIEW / '+String(course+1).padStart(2,'0');$('courseCount').textContent='COURSE '+(course+1)+' / '+courses.length;document.title='PKP School — '+c.title;
$('overlay').replaceChildren();document.querySelectorAll('.node-marker').forEach(n=>n.remove());$('steps').replaceChildren();let d='';c.stages.forEach((s,i)=>{const p=s[5];d+=(i?' L':'M')+p[0]+' '+p[1]});$('overlay').append(svg('path',{class:'wire',d}),svg('path',{class:'wire flow',d}));
c.stages.forEach((s,i)=>{const polygon=svg('polygon',{points:s[4],class:'hot-region','data-stage':i,role:'button',tabindex:'0','aria-label':'Stage '+(i+1)+': '+s[1],'aria-pressed':'false'});polygon.addEventListener('click',()=>stageSelect(i));polygon.addEventListener('keydown',e=>{if(e.key==='Enter'||e.code==='Space'){e.preventDefault();e.stopPropagation();stageSelect(i)}});$('overlay').append(polygon);const g=document.createElement('span');g.className='node-marker marker';g.dataset.marker=i;g.setAttribute('aria-hidden','true');g.style.left=s[5][0]+'%';g.style.top=s[5][1]+'%';g.textContent=String(i+1).padStart(2,'0');$('world').append(g);const b=document.createElement('button');b.className='step';b.dataset.stage=i;const small=document.createElement('small');small.textContent=String(i+1).padStart(2,'0')+' / '+s[0];const strong=document.createElement('strong');strong.textContent=s[1];b.append(small,strong);b.addEventListener('click',()=>stageSelect(i));$('steps').append(b)});center()}
function paint(){const c=courses[course],s=c.stages[current];$('kicker').textContent=String(current+1).padStart(2,'0')+' / '+s[0];$('title').textContent=s[2];$('description').textContent=s[3];$('counter').textContent=String(current+1).padStart(2,'0')+' / '+String(c.stages.length).padStart(2,'0');$('sceneStatus').textContent=s[1].toUpperCase()+' / '+s[0];document.querySelectorAll('[data-stage]').forEach(b=>{const active=+b.dataset.stage===current;b.classList.toggle('active',active);b.setAttribute('aria-pressed',String(active))});document.querySelectorAll('[data-marker]').forEach(b=>b.classList.toggle('active',+b.dataset.marker===current));[...$('courses').children].forEach((b,i)=>b.setAttribute('aria-pressed',String(i===course)));progress()}
function progress(){const value=(current+elapsed/duration)/courses[course].stages.length*100;$('bar').style.width=value+'%';document.querySelector('.progress').setAttribute('aria-valuenow',Math.round(value))}
function playback(){document.body.classList.toggle('paused',!playing);document.body.classList.toggle('still',reduced.matches);$('play').textContent=playing?'Ⅱ Pause':'▶ Play';$('play').setAttribute('aria-label',playing?'Pause autoplay':'Start autoplay');$('play').setAttribute('aria-pressed',String(playing));if(!playing)center()}
$('play').addEventListener('click',()=>{playing=!playing;last=0;playback()});$('restart').addEventListener('click',()=>{current=0;elapsed=0;last=0;playing=!reduced.matches;paint();playback()});$('prevCourse').addEventListener('click',()=>courseSelect(course-1));$('nextCourse').addEventListener('click',()=>courseSelect(course+1));
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();stageSelect(current+(e.key==='ArrowRight'?1:-1))}if(e.code==='Space'&&e.target===document.body){e.preventDefault();$('play').click()}});
function center(){$('world').style.setProperty('--px','0px');$('world').style.setProperty('--py','0px')}$('stage').addEventListener('pointerleave',center);$('stage').addEventListener('pointermove',e=>{if(reduced.matches||!playing||e.pointerType==='touch')return;const r=$('stage').getBoundingClientRect();$('world').style.setProperty('--px',((e.clientX-r.left)/r.width-.5)*7+'px');$('world').style.setProperty('--py',((e.clientY-r.top)/r.height-.5)*5+'px')});
$('fullscreen').hidden=!document.fullscreenEnabled;$('fullscreen').addEventListener('click',async()=>{try{if(document.fullscreenElement)await document.exitFullscreen();else await $('theater').requestFullscreen()}catch{$('fullscreen').textContent='Fullscreen unavailable'}});document.addEventListener('fullscreenchange',()=>{$('fullscreen').textContent=document.fullscreenElement?'⛶ Exit fullscreen':'⛶ Fullscreen'});document.addEventListener('visibilitychange',()=>{last=0});reduced.addEventListener('change',()=>{if(reduced.matches)playing=false;playback()});
function tick(time){if(last&&playing&&!document.hidden){elapsed+=Math.min(time-last,100);if(elapsed>=duration){elapsed-=duration;current++;if(current>=courses[course].stages.length){course=(course+1)%courses.length;current=0;load()}paint()}progress()}last=time;requestAnimationFrame(tick)}load();paint();playback();requestAnimationFrame(tick);
})();
</script></body></html>
